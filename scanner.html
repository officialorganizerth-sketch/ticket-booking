<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ระบบเช็คอินหน้างาน</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #result { font-size: 24px; font-weight: bold; margin-top: 20px; padding: 20px; border-radius: 10px; }
    input { font-size: 18px; padding: 10px; width: 80%; }
    button { font-size: 18px; padding: 10px 20px; margin-top: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>ระบบเช็คอินหน้างาน</h2>
  <input type="text" id="ticketInput" placeholder="สแกน QR Code หรือกรอกรหัสตั๋ว" autofocus>
  <br>
  <button onclick="checkIn()">ตรวจสอบตั๋ว</button>
  <div id="result"></div>

  <script>
    // 📌 วาง URL ของ Google Apps Script ของคุณที่นี่
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwka-Cct7ZCQcJEtGTX8QRVwvTzPmxbDsl6AhuVhnxvLiwf4nZ9rJ-r35FyMGJWbvec/exec";

    function checkIn() {
    const ticketCode = document.getElementById('ticketInput').value.trim();
    const resDiv = document.getElementById('result');

    if (!ticketCode) {
        alert('กรุณากรอกหรือสแกนรหัสตั๋ว');
        return;
    }

    // --- ช่วงตรวจซ้ำตรงนี้ครับ ---
    let checkedList = JSON.parse(localStorage.getItem('checkedTickets')) || [];
    
    if (checkedList.includes(ticketCode)) {
        // 🔴 ถ้าเคยสแกนไปแล้ว (ขึ้นเตือนสตาฟทันที)
        resDiv.style.backgroundColor = "#ffebee";
        resDiv.style.color = "#c62828";
        resDiv.innerHTML = `⚠️ <b>แจ้งเตือน:</b> ตั๋วรหัส "${ticketCode}" นี้ถูกใช้งานไปแล้ว!`;
        alert(`⚠️ แจ้งเตือน! ตั๋วรหัส ${ticketCode} นี้ถูกใช้งานไปแล้ว!`);
        document.getElementById('ticketInput').value = "";
        document.getElementById('ticketInput').focus();
        return; // หยุดการทำงาน ไม่ส่งซ้ำ
    }

    // 🟢 ถ้ายังไม่เคยสแกน ให้บันทึกเก็บไว้แล้วส่งข้อมูลปกติ
    checkedList.push(ticketCode);
    localStorage.setItem('checkedTickets', JSON.stringify(checkedList));

    fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ action: "checkin", ticketCode: ticketCode })
    })
    .then(() => {
        resDiv.innerHTML = "✅ ตรวจสอบแล้ว: " + ticketCode;
        resDiv.style.backgroundColor = "#e8f5e9";
        resDiv.style.color = "#2e7d32";
        document.getElementById('ticketInput').value = "";
        document.getElementById('ticketInput').focus();
    })
    .catch(err => {
        resDiv.innerHTML = "❌ เกิดข้อผิดพลาด";
        resDiv.style.backgroundColor = "#ffebee";
    });
}
  </script>
</body>
</html>
